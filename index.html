<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แบบจำลองหลุมดำ 3 มิติ — Schwarzschild 3D Simulation</title>
  <style>
    :root {
      --bg: #070a10;
      --surface: #101622;
      --surface-elevated: #161f30;
      --surface-hover: #1e293f;
      --border: #25324a;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --brand: #f59e0b;
      --brand-hover: #fbbf24;
      --brand-ink: #090d16;
      --accent: #38bdf8;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1440px;
      margin: 0 auto;
    }
    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(16, 22, 34, 0.92);
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bh-emblem {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #000 38%, #f59e0b 54%, rgba(245, 158, 11, 0.18) 72%, transparent 100%);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
      flex-shrink: 0;
    }
    .title-block h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .title-block p {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .preset-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: var(--surface-hover);
      border-color: #384b6e;
    }
    .btn-primary {
      background: var(--brand);
      color: var(--brand-ink);
      border-color: transparent;
    }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-active {
      border-color: var(--brand);
      color: var(--brand);
      background: rgba(245, 158, 11, 0.12);
    }
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
    }
    @media (min-width: 980px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr) 360px;
        padding: 20px 24px;
        align-items: start;
      }
    }
    .viewport-card {
      position: relative;
      background: #030508;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 400px;
      height: 54vh;
      touch-action: none;
      user-select: none;
    }
    @media (min-width: 980px) {
      .viewport-card {
        height: calc(100vh - 118px);
        min-height: 580px;
        position: sticky;
        top: 20px;
      }
    }
    #glCanvas, #hudCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #glCanvas { cursor: grab; }
    #glCanvas:active { cursor: grabbing; }
    #hudCanvas { pointer-events: none; }
    .viewport-hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .hud-pill {
      background: rgba(10, 14, 23, 0.76);
      border: 1px solid rgba(148, 163, 184, 0.22);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }
    .viewport-controls-floating {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1rem;
      background: rgba(16, 22, 34, 0.85);
      backdrop-filter: blur(8px);
    }
    .viewport-caption {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(10, 14, 23, 0.76);
      border: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--muted);
      max-width: calc(100% - 150px);
      pointer-events: none;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .panel-title {
      margin: 0 0 16px 0;
      font-size: 0.9375rem;
      font-weight: 700;
    }
    .control-group { margin-bottom: 16px; }
    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      font-size: 0.8125rem;
    }
    .control-label { color: #dbe4f0; font-weight: 500; }
    .control-val {
      font-family: var(--mono);
      font-size: 0.8125rem;
      color: var(--brand);
      font-weight: 600;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--brand);
      border: 2px solid #fff;
      cursor: pointer;
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .seg-btn {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 7px 6px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--surface-elevated);
      color: var(--ink);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid rgba(37, 50, 74, 0.6);
      font-size: 0.8125rem;
    }
    .toggle-row:first-of-type { border-top: none; padding-top: 2px; }
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--surface-elevated);
      border: 1px solid var(--border);
      transition: 0.2s;
      border-radius: 999px;
    }
    .slider-toggle::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #cbd5e1;
      transition: 0.2s;
      border-radius: 50%;
    }
    .switch input:checked + .slider-toggle {
      background-color: rgba(245, 158, 11, 0.25);
      border-color: var(--brand);
    }
    .switch input:checked + .slider-toggle::before {
      transform: translateX(18px);
      background-color: var(--brand);
    }
    .action-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }
    .metrics-list { display: grid; gap: 10px; }
    .metric-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(37, 50, 74, 0.55);
      font-size: 0.8125rem;
    }
    .metric-item:last-child { border-bottom: none; padding-bottom: 0; }
    .metric-name { color: var(--muted); }
    .metric-name code { font-family: var(--mono); color: #cbd5e1; font-size: 0.75rem; }
    .metric-value { font-family: var(--mono); font-weight: 600; text-align: right; }
    .model-note {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-group">
        <div class="bh-emblem" aria-hidden="true"></div>
        <div class="title-block">
          <h1>แบบจำลองหลุมดำ 3 มิติ (Schwarzschild Ray-Tracing)</h1>
          <p>จำลองการโค้งงอของแสง จานพอกพูนมวล และวงโคจรสัมพัทธภาพแบบโต้ตอบ 360°</p>
        </div>
      </div>
      <div class="preset-bar">
        <button type="button" class="btn" id="viewInclinedBtn">มุมเฉียง (Gargantua)</button>
        <button type="button" class="btn" id="viewEdgeBtn">มุมระนาบจาน (Edge-On)</button>
        <button type="button" class="btn" id="viewPolarBtn">มุมขั้วเหนือ (Top-Down)</button>
        <button type="button" class="btn" id="autoOrbitBtn" aria-pressed="true">หมุนอัตโนมัติ</button>
      </div>
    </header>

    <main class="workspace">
      <section class="viewport-card" aria-label="พื้นที่แสดงผลหลุมดำ 3 มิติ">
        <canvas id="glCanvas"></canvas>
        <canvas id="hudCanvas"></canvas>
        <div class="viewport-hud-top">
          <div class="hud-pill" id="camReadout">ระยะผู้สังเกต: 11.0 rₛ • มุมเอียง: +14°</div>
        </div>
        <div class="viewport-caption">
          ลากเมาส์หรือนิ้วเพื่อหมุนดูรอบทิศทาง • เลื่อนลูกกลิ้งเพื่อซูมเข้า-ออก
        </div>
        <div class="viewport-controls-floating">
          <button type="button" class="btn icon-btn" id="zoomInBtn" title="ซูมเข้า">+</button>
          <button type="button" class="btn icon-btn" id="zoomOutBtn" title="ซูมออก">−</button>
          <button type="button" class="btn icon-btn" id="resetCamBtn" title="รีเซ็ตมุมกล้อง">↺</button>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <h2 class="panel-title">พารามิเตอร์หลุมดำและการแสดงผล</h2>
          <div class="control-group">
            <div class="control-header">
              <label class="control-label" for="massSlider">มวลหลุมดำ (Solar Masses)</label>
              <span class="control-val" id="massVal">15 M☉</span>
            </div>
            <input type="range" id="massSlider" min="3" max="100" step="1" value="15">
          </div>
          <div class="control-group">
            <div class="control-header">
              <label class="control-label" for="lensingSlider">เลนส์ความโน้มถ่วง (GR Lensing)</label>
              <span class="control-val" id="lensingVal">100%</span>
            </div>
            <input type="range" id="lensingSlider" min="0" max="150" step="1" value="100">
